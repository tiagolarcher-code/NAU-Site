<!DOCTYPE html>
<html lang="pt" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAU Assessoria · Intermediacao Estrategica de Negocios</title>
<meta name="description" content="NAU Assessoria - conectamos capital, ativos e oportunidades estrategicas no agronegocio e infraestrutura brasileiros.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#0d1f3a;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:8px 32px;background:rgba(8,16,40,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,0.12)}
.nav-right{display:flex;align-items:center;gap:10px}
.lang-btn{background:none;border:1px solid rgba(201,168,76,0.35);color:#c9a84c;font-size:0.62rem;letter-spacing:0.12em;padding:4px 10px;border-radius:2px;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all 0.2s}
.lang-btn:hover{background:rgba(201,168,76,0.1);border-color:#c9a84c}
.hamburger{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;z-index:300}
.hamburger span{display:block;width:24px;height:2px;background:#7a8faa;transition:all 0.3s}
.hamburger:hover span{background:#c9a84c}
.nav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:rgba(8,16,40,0.98);border-bottom:1px solid rgba(201,168,76,0.2);padding:8px 0;z-index:100}
.nav-links.open{display:flex}
.nav-links a{color:#7a8faa;text-decoration:none;font-size:0.75rem;letter-spacing:0.09em;text-transform:uppercase;transition:color 0.2s;padding:10px 32px;width:100%;display:block}
.nav-links a:hover{color:#c9a84c}
.nav-links .admin-link{color:#c9a84c;border-top:1px solid rgba(201,168,76,0.15);margin-top:6px;padding-top:14px}

/* SLIDES */
.slide-section{width:100%;position:relative}
.slide-section img.slide-img{width:100%;height:auto;display:block}

/* HERO */
#hero{position:relative}
.hero-links{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 5% 26%;z-index:2;pointer-events:none}
.hero-btns{display:flex;gap:16px;pointer-events:auto}
.hero-btn{padding:14px 32px;border:none;color:transparent;text-decoration:none;font-size:0.85rem;cursor:pointer;background:transparent}

/* CONTATO */
#contato{position:relative}
.contato-full-cover{position:absolute;top:0;left:0;right:0;bottom:0;background:#0d1f3a;z-index:1;pointer-events:none}
.contato-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 5% 5%;z-index:2}
#form-contato{width:100%;max-width:580px;background:rgba(8,16,40,0.9);border:1px solid rgba(201,168,76,0.25);border-radius:4px;padding:32px 36px;backdrop-filter:blur(10px)}
#form-contato h3{color:#c9a84c;font-size:0.75rem;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:24px;font-weight:400}
.fc-field{margin-bottom:16px}
.fc-field label{display:block;color:#7a8faa;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px}
.fc-field input,.fc-field textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.2);border-radius:2px;color:#e0e8f0;font-family:inherit;font-size:0.85rem;padding:10px 14px;outline:none;transition:border-color 0.2s;resize:none}
.fc-field input:focus,.fc-field textarea:focus{border-color:rgba(201,168,76,0.6)}
.fc-field textarea{height:100px}
.fc-submit{width:100%;padding:13px;background:#c9a84c;border:none;border-radius:2px;color:#0d1f3a;font-family:inherit;font-size:0.82rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;margin-top:8px}
.fc-submit:hover{background:#e8c96a}
.fc-submit:disabled{background:rgba(201,168,76,0.4);cursor:not-allowed}
#fc-status{margin-top:12px;font-size:0.78rem;letter-spacing:0.04em;min-height:18px;text-align:center}
#fc-status.ok{color:#5ec77a}
#fc-status.err{color:#e05555}

/* PLATAFORMAS */
#plataformas{background:#091729;border-top:1px solid rgba(201,168,76,0.2);border-bottom:1px solid rgba(201,168,76,0.2);padding:18px 40px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.plt-label{font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:#556688;margin-right:6px}
.plt-btn{padding:7px 18px;border:1px solid rgba(201,168,76,0.35);border-radius:3px;color:#c9a84c;font-size:0.75rem;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.2s;white-space:nowrap;cursor:pointer;background:transparent;font-family:inherit}
.plt-btn:hover{border-color:#c9a84c;background:rgba(201,168,76,0.08)}

/* ADMIN MODAL */
#admin-modal{display:none;position:fixed;inset:0;background:rgba(8,16,40,0.93);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
#admin-modal.open{display:flex}
.admin-box{background:#0d1f3a;border:1px solid rgba(201,168,76,0.3);border-radius:6px;padding:36px 40px;width:100%;max-width:420px;position:relative}
.admin-close{position:absolute;top:14px;right:18px;background:none;border:none;color:#556688;font-size:1.1rem;cursor:pointer;line-height:1;padding:4px}
.admin-close:hover{color:#c9a84c}
.admin-box h2{color:#c9a84c;font-size:0.7rem;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:26px;font-weight:500}
.af-field{margin-bottom:14px}
.af-field label{display:block;color:#7a8faa;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px}
.af-field input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.2);border-radius:2px;color:#e0e8f0;font-family:inherit;font-size:0.85rem;padding:10px 14px;outline:none;transition:border-color 0.2s}
.af-field input:focus{border-color:rgba(201,168,76,0.6)}
.af-submit{width:100%;padding:12px;background:#c9a84c;border:none;border-radius:2px;color:#0d1f3a;font-family:inherit;font-size:0.8rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;margin-top:10px;transition:background 0.2s}
.af-submit:hover{background:#e8c96a}
#admin-err{color:#e05555;font-size:0.75rem;margin-top:10px;min-height:16px;text-align:center}
#admin-panel{display:none}
#admin-panel h2{color:#c9a84c;font-size:0.7rem;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:22px;font-weight:500}
.ap-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ap-btn{display:block;padding:18px 12px;background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,0.22);border-radius:4px;color:#e0e8f0;text-decoration:none;font-size:0.76rem;letter-spacing:0.07em;text-transform:uppercase;text-align:center;transition:all 0.2s}
.ap-btn:hover{background:rgba(201,168,76,0.11);border-color:#c9a84c;color:#c9a84c}
.ap-sub{display:block;font-size:0.6rem;color:#556688;margin-top:5px;letter-spacing:0.04em;text-transform:none}

@media(max-width:768px){
nav{padding:7px 14px}
#plataformas{padding:14px 16px}
.contato-overlay{padding:4% 5% 4%}
#form-contato{padding:22px 20px;max-width:100%}
.admin-box{padding:28px 22px;margin:16px}
.ap-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav>
<button class="hamburger" onclick="document.getElementById('nav-menu').classList.toggle('open')" aria-label="Menu">
<span></span><span></span><span></span>
</button>
<div class="nav-links" id="nav-menu">
<a href="#areas" data-pt="Assessoria" data-en="Advisory">Assessoria</a>
<a href="#oportunidades" data-pt="Oportunidades" data-en="Opportunities">Oportunidades</a>
<a href="#processo" data-pt="Processo" data-en="Process">Processo</a>
<a href="#confidencialidade" data-pt="Confidencialidade" data-en="Confidentiality">Confidencialidade</a>

<a href="#" class="admin-link" onclick="openAdmin();document.getElementById('nav-menu').classList.remove('open');return false;" data-pt="Administração NAU" data-en="NAU Admin">Administração NAU</a>
</div>
<div class="nav-right">
<button class="lang-btn" id="lang-toggle" onclick="toggleLang()">EN</button>
</div>
</nav>

<section id="hero" class="slide-section">
<img class="slide-img" src="imagens/1_Conectamos-capital-ativos-e-oportunidades-estrategicas.png" alt="NAU - Intermediacao Estrategica de Negocios">
<div class="hero-links"><div class="hero-btns"><a class="hero-btn" href="#oportunidades">&#160;</a><a class="hero-btn" href="#contato">&#160;</a></div></div>
</section>

<div id="plataformas">
<span class="plt-label" data-pt="Acesso Interno" data-en="Internal Access">Acesso Interno</span>
<button class="plt-btn" onclick="openAdmin()" data-pt="&#9657; Administração NAU" data-en="&#9657; NAU Admin">&#9657; Administração NAU</button>

<section id="areas" class="slide-section">
<img class="slide-img" src="imagens/2_Seis-areas-de-atuacao.png" alt="Seis Areas de Atuacao">
</section>

<section id="oportunidades" class="slide-section">
<img class="slide-img" src="imagens/3_Oportunidades-Selecionadas.png" alt="Oportunidades Selecionadas">

<img class="slide-img" src="imagens/4_Como-a-NAU-Trabalha.png" alt="Como a NAU Trabalha">

<script>
(function(){
var ERR={
pt:{'fill':'Por favor preencha todos os campos.','sending':'A enviar...','sent':'Mensagem enviada! Entraremos em contacto brevemente.','fail':'Nao foi possivel enviar. Tente por e-mail ou WhatsApp.','send':'Enviar mensagem','cred':'Credenciais incorretas.'},
en:{'fill':'Please fill in all fields.','sending':'Sending...','sent':'Message sent! We will contact you shortly.','fail':'Could not send. Try e-mail or WhatsApp.','send':'Send message','cred':'Incorrect credentials.'}
};
var lang=localStorage.getItem('nau_lang')||'pt';
function applyLang(){
document.getElementById('lang-toggle').textContent=lang==='pt'?'EN':'PT';
document.querySelectorAll('[data-pt]').forEach(function(el){el.textContent=lang==='pt'?el.getAttribute('data-pt'):el.getAttribute('data-en');});
document.querySelectorAll('[data-pt-ph]').forEach(function(el){el.placeholder=lang==='pt'?el.getAttribute('data-pt-ph'):el.getAttribute('data-en-ph');});
}
window.toggleLang=function(){lang=lang==='pt'?'en':'pt';localStorage.setItem('nau_lang',lang);applyLang();};
applyLang();

// CONTACT FORM
var form=document.getElementById('form-contato');
var btn=form.querySelector('.fc-submit');
var st=document.getElementById('fc-status');
form.addEventListener('submit',async function(e){
e.preventDefault();
var nome=document.getElementById('fc-nome').value.trim();
var email=document.getElementById('fc-email').value.trim();
var mensagem=document.getElementById('fc-mensagem').value.trim();
var t=ERR[lang];
if(!nome||!email||!mensagem){st.textContent=t.fill;st.className='err';return;}
btn.disabled=true;btn.textContent=t.sending;st.textContent='';st.className='';
try{
var res=await fetch('/api/contato',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:nome,email:email,mensagem:mensagem})});
var data=await res.json();
if(res.ok&&data.ok){st.textContent=t.sent;st.className='ok';form.reset();}
else{throw new Error(data.erro||'err');}
}catch(e2){st.textContent=t.fail;st.className='err';}
finally{btn.disabled=false;btn.textContent=t.send;}
});

// ADMIN MODAL
window.openAdmin=function(){
var m=document.getElementById('admin-modal');
m.classList.add('open');
if(sessionStorage.getItem('nau_admin')==='1'){
document.getElementById('admin-login-view').style.display='none';
document.getElementById('admin-panel').style.display='block';
}else{
document.getElementById('admin-login-view').style.display='block';
document.getElementById('admin-panel').style.display='none';
document.getElementById('af-user').value='';
document.getElementById('af-pass').value='';
document.getElementById('admin-err').textContent='';
setTimeout(function(){document.getElementById('af-user').focus();},80);
}
};
window.closeAdmin=function(){document.getElementById('admin-modal').classList.remove('open');};
window.adminLogin=function(){
var u=document.getElementById('af-user').value.trim();
var p=document.getElementById('af-pass').value;
if(u==='Tiago'&&p==='123456'){
sessionStorage.setItem('nau_admin','1');
sessionStorage.setItem('nau_plt','1');
document.getElementById('admin-login-view').style.display='none';
document.getElementById('admin-panel').style.display='block';
document.getElementById('admin-err').textContent='';
}else{
document.getElementById('admin-err').textContent=ERR[lang].cred;
}
};
document.getElementById('admin-modal').addEventListener('click',function(e){if(e.target===this)closeAdmin();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAdmin();});
document.getElementById('af-pass').addEventListener('keydown',function(e){if(e.key==='Enter')adminLogin();});
})();
</script>

</body>
