<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAU Assessoria · Intermediacao Estrategica de Negocios</title>
<meta name="description" content="NAU Assessoria - conectamos capital, ativos e oportunidades estrategicas no agronegocio e infraestrutura brasileiros.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#0d1f3a;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:8px 32px;background:rgba(8,16,40,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,0.12)}

.hamburger{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;z-index:300;margin-left:16px}
.hamburger span{display:block;width:24px;height:2px;background:#7a8faa;transition:all 0.3s}
.hamburger:hover span{background:#c9a84c}
.nav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:rgba(8,16,40,0.98);border-bottom:1px solid rgba(201,168,76,0.2);padding:8px 0;z-index:100}
.nav-links.open{display:flex}
.nav-links a{color:#7a8faa;text-decoration:none;font-size:0.75rem;letter-spacing:0.09em;text-transform:uppercase;transition:color 0.2s;padding:10px 32px;width:100%;display:block}
.nav-links a:hover{color:#c9a84c}




/* SECCOES DE SLIDE */
.slide-section{width:100%;position:relative}
.slide-section img.slide-img{width:100%;height:auto;display:block}

/* HERO */
#hero{position:relative}
.hero-links{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 5% 26%;z-index:2;pointer-events:none}
.hero-btns{display:flex;gap:16px;pointer-events:auto}
.hero-btn{padding:14px 32px;border:none;color:transparent;text-decoration:none;font-size:0.85rem;cursor:pointer;background:transparent}
#hero{position:relative}









/* CONTATO */
#contato{position:relative}
.contato-full-cover{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(8,16,40,0.96);z-index:1;pointer-events:none}

.contato-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 7% 8%;z-index:2}

#form-contato{width:100%;max-width:480px;background:rgba(8,16,40,0.88);border:1px solid rgba(201,168,76,0.25);border-radius:4px;padding:32px 36px;backdrop-filter:blur(10px)}
#form-contato h3{color:#c9a84c;font-size:0.75rem;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:24px;font-weight:400}
.fc-field{margin-bottom:16px}
.fc-field label{display:block;color:#7a8faa;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px}
.fc-field input,.fc-field textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.2);border-radius:2px;color:#e0e8f0;font-family:inherit;font-size:0.85rem;padding:10px 14px;outline:none;transition:border-color 0.2s;resize:none}
.fc-field input:focus,.fc-field textarea:focus{border-color:rgba(201,168,76,0.6)}
.fc-field textarea{height:100px}
.fc-submit{width:100%;padding:13px;background:#c9a84c;border:none;border-radius:2px;color:#0d1f3a;font-family:inherit;font-size:0.82rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;margin-top:8px}
.fc-submit:hover{background:#e8c96a}
.fc-submit:disabled{background:rgba(201,168,76,0.4);cursor:not-allowed}
#fc-status{margin-top:12px;font-size:0.78rem;letter-spacing:0.04em;min-height:18px;text-align:center}
#fc-status.ok{color:#5ec77a}
#fc-status.err{color:#e05555}

/* PLATAFORMAS */
#plataformas{background:#091729;border-top:1px solid rgba(201,168,76,0.2);border-bottom:1px solid rgba(201,168,76,0.2);padding:18px 40px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.plt-label{font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:#556688;margin-right:6px}
.plt-btn{padding:7px 18px;border:1px solid rgba(201,168,76,0.3);border-radius:3px;color:#aabbcc;text-decoration:none;font-size:0.75rem;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.2s;white-space:nowrap}
.plt-btn:hover{border-color:#c9a84c;color:#c9a84c;background:rgba(201,168,76,0.06)}

@media(max-width:768px){
nav{padding:7px 14px}

#plataformas{padding:14px 16px}



.contato-overlay{padding:4% 5% 4%}
#form-contato{padding:22px 20px;max-width:100%}
}
</style>
</head>
<body>

<!-- NAV FIXO -->
<nav>
<button class="hamburger" onclick="document.getElementById('nav-menu').classList.toggle('open')" aria-label="Menu">
<span></span><span></span><span></span>
</button>
<div class="nav-links" id="nav-menu">
<a href="#areas">Assessoria</a>
<a href="#oportunidades">Oportunidades</a>
<a href="#processo">Processo</a>
<a href="#confidencialidade">Confidencialidade</a>
<a href="#diferenciais">Diferenciais</a>
<a href="#contato">Contato</a>
<a href="/trader/">Trader Desk</a>
<a href="/ma/">M&A Marketplace</a>
<a href="/crm/">CRM</a>
<a href="/licitus/">Licitus</a>
</div>

</nav>

<!-- HERO -->
<section id="hero" class="slide-section">
<img class="slide-img" src="imagens/1_Conectamos-capital-ativos-e-oportunidades-estrategicas.png" alt="NAU - Intermediacao Estrategica de Negocios">
<div class="hero-links"><div class="hero-btns"><a class="hero-btn" href="#oportunidades">Explorar oportunidades</a><a class="hero-btn" href="#contato">Falar com a NAU</a></div></div>
</section>

<!-- BARRA DE PLATAFORMAS -->
<div id="plataformas">
<span class="plt-label">Plataformas</span>
<a class="plt-btn" href="/trader/">Trader Desk</a>
<a class="plt-btn" href="/ma/">M&amp;A Terminal</a>
<a class="plt-btn" href="/crm/">CRM</a>
<a class="plt-btn" href="/licitus/">Licitus</a>
</div>

<!-- AREAS -->
<section id="areas" class="slide-section">
<img class="slide-img" src="imagens/2_Seis-areas-de-atuacao.png" alt="Seis Areas de Atuacao">
</section>

<!-- OPORTUNIDADES -->
<section id="oportunidades" class="slide-section">
<img class="slide-img" src="imagens/3_Oportunidades-Selecionadas.png" alt="Oportunidades Selecionadas">
</section>

<!-- PROCESSO -->
<section id="processo" class="slide-section">
<img class="slide-img" src="imagens/4_Como-a-NAU-Trabalha.png" alt="Como a NAU Trabalha">
</section>

<!-- CONFIDENCIALIDADE -->
<section id="confidencialidade" class="slide-section">
<img class="slide-img" src="imagens/5_Protocolo-de-Confidencialidade.png" alt="Protocolo de Confidencialidade">
</section>

<!-- DIFERENCIAIS -->
<section id="diferenciais" class="slide-section">
<img class="slide-img" src="imagens/6_Por-que-a-NAU.png" alt="Por que a NAU">
</section>

<!-- CONTATO -->
<section id="contato" class="slide-section">
<img class="slide-img" src="imagens/7_Solicitar-uma-Apresentacao-de-Negocios.png" alt="Solicitar uma Apresentacao de Negocios">
<div class="contato-full-cover"></div>
<div class="contato-overlay">
<form id="form-contato" novalidate>
<h3>Solicitar uma apresentacao</h3>
<div class="fc-field">
<label for="fc-nome">Nome</label>
<input type="text" id="fc-nome" name="nome" placeholder="O seu nome" required>
</div>
<div class="fc-field">
<label for="fc-email">E-mail</label>
<input type="email" id="fc-email" name="email" placeholder="seuemail@empresa.com" required>
</div>
<div class="fc-field">
<label for="fc-mensagem">Mensagem</label>
<textarea id="fc-mensagem" name="mensagem" placeholder="Descreva brevemente o seu interesse ou activo" required></textarea>
</div>
<button class="fc-submit" type="submit">Enviar mensagem</button>
<p id="fc-status"></p>
</form>
</div>
</section>

<script>
(function(){
var form = document.getElementById('form-contato');
var btn = form.querySelector('.fc-submit');
var st = document.getElementById('fc-status');

form.addEventListener('submit', async function(e){
e.preventDefault();
var nome = document.getElementById('fc-nome').value.trim();
var email = document.getElementById('fc-email').value.trim();
var mensagem = document.getElementById('fc-mensagem').value.trim();

if(!nome || !email || !mensagem){
st.textContent = 'Por favor preencha todos os campos.';
st.className = 'err';
return;
}

btn.disabled = true;
btn.textContent = 'A enviar...';
st.textContent = '';
st.className = '';

try{
var res = await fetch('/api/contato', {
method: 'POST',
headers: {'Content-Type':'application/json'},
body: JSON.stringify({nome: nome, email: email, mensagem: mensagem})
});
var data = await res.json();
if(res.ok && data.ok){
st.textContent = 'Mensagem enviada! Entraremos em contacto brevemente.';
st.className = 'ok';
form.reset();
} else {
throw new Error(data.erro || 'Erro desconhecido');
}
} catch(err){
st.textContent = 'Nao foi possivel enviar. Tente por e-mail ou WhatsApp.';
st.className = 'err';
} finally {
btn.disabled = false;
btn.textContent = 'Enviar mensagem';
}
});
})();
</script>
